<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="미분양 비교표 읽는 법 — 단지 세 곳의 값을 행마다 나란히 놓고 맨 아래에 자료 출처 한 줄을 붙인 비교표">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E3A5F" flood-opacity="0.11"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 좌측 카피 -->
  <text x="120" y="280" font-family="'Noto Serif KR', serif" font-size="96" font-weight="700" fill="#1F2937" letter-spacing="-3">미분양 비교표</text>
  <text x="120" y="400" font-family="'Noto Serif KR', serif" font-size="96" font-weight="700" fill="#1A8A8A" letter-spacing="-3">값과 출처</text>
  <rect x="120" y="430" width="80" height="4" fill="#D4A574"/>
  <text x="120" y="510" font-family="'Pretendard', sans-serif" font-size="32" font-weight="400" fill="#4B5563">17행을 값 그대로 나란히 · 판정 표시 없이</text>
  <text x="120" y="555" font-family="'Pretendard', sans-serif" font-size="28" font-weight="300" fill="#6B7280">법정 기준과 자료 출처를 함께 읽는 법</text>

  <!-- 좌측 하단 읽는 법 3가지 -->
  <g transform="translate(120, 700)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#1A8A8A" stroke-width="2"/>
    <text x="90" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#1A8A8A" text-anchor="middle">같은 행끼리</text>
    <text x="90" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">단위가 같은 값만</text>
    <rect x="200" y="0" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#1A8A8A" stroke-width="2"/>
    <text x="290" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#1A8A8A" text-anchor="middle">'-' 는 자료 없음</text>
    <text x="290" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">0 이 아닙니다</text>
    <rect x="400" y="0" width="180" height="80" rx="12" fill="#1A8A8A"/>
    <text x="490" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">출처 한 줄</text>
    <text x="490" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" opacity="0.85">화면 맨 아래</text>
  </g>

  <!-- 우측 비교표 카드 -->
  <g transform="translate(1000, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="800" height="700" rx="16" fill="url(#card)" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="0" width="800" height="60" rx="16" fill="#1A8A8A"/>
    <rect x="0" y="44" width="800" height="16" fill="#1A8A8A"/>
    <circle cx="32" cy="30" r="6" fill="#D4A574"/>
    <circle cx="56" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <text x="120" y="38" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">/mibunyang/compare · 17행 비교표</text>
    <rect x="30" y="90" width="740" height="52" fill="#F3F4F6"/>
    <text x="50" y="123.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#374151">항목</text>
    <text x="345.0" y="123.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 A</text>
    <text x="515.0" y="123.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 B</text>
    <text x="685.0" y="123.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 C</text>
    <line x1="30" y1="142" x2="770" y2="142" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="175.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">세대수</text>
    <text x="345.0" y="175.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">1,047</text>
    <text x="515.0" y="175.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">620</text>
    <text x="685.0" y="175.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">298</text>
    <rect x="30" y="194" width="740" height="52" fill="#F9FAFB"/>
    <line x1="30" y1="194" x2="770" y2="194" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="227.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">미분양률(%)</text>
    <text x="345.0" y="227.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">11.6</text>
    <text x="515.0" y="227.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">4.2</text>
    <text x="685.0" y="227.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">18.9</text>
    <line x1="30" y1="246" x2="770" y2="246" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="279.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">분양가 최저(만원)</text>
    <text x="345.0" y="279.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">41,800</text>
    <text x="515.0" y="279.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">38,500</text>
    <text x="685.0" y="279.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">29,900</text>
    <rect x="30" y="298" width="740" height="52" fill="#F9FAFB"/>
    <line x1="30" y1="298" x2="770" y2="298" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="331.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">평당가(만원)</text>
    <text x="345.0" y="331.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">1,820</text>
    <text x="515.0" y="331.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">2,150</text>
    <text x="685.0" y="331.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">-</text>
    <line x1="30" y1="350" x2="770" y2="350" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="383.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">세대당 주차(대)</text>
    <text x="345.0" y="383.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">1.2</text>
    <text x="515.0" y="383.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">1.05</text>
    <text x="685.0" y="383.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">0.9</text>
    <rect x="30" y="402" width="740" height="52" fill="#F9FAFB"/>
    <line x1="30" y1="402" x2="770" y2="402" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="435.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">최고층</text>
    <text x="345.0" y="435.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">34</text>
    <text x="515.0" y="435.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">25</text>
    <text x="685.0" y="435.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">29</text>
    <line x1="30" y1="454" x2="770" y2="454" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="487.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">용적률(%)</text>
    <text x="345.0" y="487.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">214</text>
    <text x="515.0" y="487.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">249</text>
    <text x="685.0" y="487.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">199</text>
    <rect x="30" y="506" width="740" height="52" fill="#F9FAFB"/>
    <line x1="30" y1="506" x2="770" y2="506" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="539.28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#374151">큰 도로 거리(추정)</text>
    <text x="345.0" y="539.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">100~200m</text>
    <text x="515.0" y="539.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">50m 이내</text>
    <text x="685.0" y="539.28" font-family="'Pretendard', sans-serif" font-size="18" fill="#4B5563" text-anchor="middle">200m 넘음</text>
    <line x1="260" y1="90" x2="260" y2="558" stroke="#E5E7EB" stroke-width="1"/>
    <text x="400" y="590" font-family="'Pretendard', sans-serif" font-size="16" fill="#9CA3AF" text-anchor="middle">··· 9행 더</text>
    <line x1="30" y1="615" x2="770" y2="615" stroke="#E5E7EB" stroke-width="1"/>
    <text x="30" y="648" font-family="'Pretendard', sans-serif" font-size="14" fill="#6B7280">출처: 국토교통부 실거래가 공개시스템 · 국토교통부 미분양주택현황 · K-apt · 에어코리아</text>
    <text x="30" y="672" font-family="'Pretendard', sans-serif" font-size="14" fill="#6B7280">네이버부동산(단지 정보) · 미분양 사업자 자료 / 법령: 국가법령정보센터</text>
  </g>
</svg>
