<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="2u부동산 — 부동산 인사이트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E0D4BE"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 도시 실루엣 (단조롭게, 눈에 안 띔) -->
  <g fill="url(#silhouette)">
    <rect x="0"    y="720" width="180" height="360"/>
    <rect x="180"  y="640" width="120" height="440"/>
    <rect x="300"  y="700" width="160" height="380"/>
    <rect x="460"  y="600" width="140" height="480"/>
    <rect x="600"  y="680" width="100" height="400"/>
    <rect x="700"  y="560" width="180" height="520"/>
    <rect x="880"  y="650" width="120" height="430"/>
    <rect x="1000" y="540" width="200" height="540"/>
    <rect x="1200" y="620" width="140" height="460"/>
    <rect x="1340" y="500" width="220" height="580"/>
    <rect x="1560" y="660" width="120" height="420"/>
    <rect x="1680" y="600" width="160" height="480"/>
    <rect x="1840" y="680" width="80"  height="400"/>
  </g>

  <!-- 첨탑 -->
  <polygon points="780,560 800,490 820,560" fill="url(#silhouette)"/>
  <polygon points="1090,540 1110,470 1130,540" fill="url(#silhouette)"/>
  <polygon points="1430,500 1450,420 1470,500" fill="url(#silhouette)"/>

  <!-- 중앙 로고/텍스트 (조용하게) -->
  <g transform="translate(960, 480)" text-anchor="middle">
    <rect x="-2" y="-90" width="4" height="60" fill="#B89968"/>
    <text y="0"
          font-family="'Noto Serif KR', serif"
          font-size="64" font-weight="700" fill="#1F2937" letter-spacing="-2">
      2u부동산
    </text>
    <text y="60"
          font-family="'Pretendard', sans-serif"
          font-size="22" fill="#6B7280" letter-spacing="2">
      부동산 인사이트
    </text>
  </g>
</svg>
