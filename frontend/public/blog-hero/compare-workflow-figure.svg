<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="검색 → 플로팅 바 → 24행 비교 표 5분 워크플로 3단">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#EBE5D9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <text x="960" y="120"
        font-family="'Noto Serif KR', serif"
        font-size="56" font-weight="700" fill="#1F2937" text-anchor="middle" letter-spacing="-2">
    검색에서 비교까지 5분 워크플로
  </text>
  <rect x="900" y="145" width="120" height="3" fill="#B89968"/>
  <text x="960" y="195"
        font-family="'Pretendard', sans-serif"
        font-size="22" fill="#6B7280" text-anchor="middle">
    클릭 3번이면 끝납니다
  </text>

  <!-- 3 단계 카드 (좌·중·우) -->

  <!-- STEP 1: 검색 -->
  <g transform="translate(120, 280)" filter="url(#shadow)">
    <rect width="500" height="600" rx="20" fill="url(#card)" stroke="#E5E7EB"/>

    <!-- 단계 번호 -->
    <circle cx="60" cy="60" r="32" fill="#1E3A5F"/>
    <text x="60" y="72" font-family="'Noto Serif KR', serif" font-size="32" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">1</text>

    <text x="120" y="72"
          font-family="'Pretendard', sans-serif"
          font-size="28" font-weight="700" fill="#1F2937">단지 검색</text>

    <!-- 검색 바 mockup -->
    <rect x="40" y="140" width="420" height="56" rx="28" fill="#F9FAFB" stroke="#D1D5DB"/>
    <circle cx="72" cy="168" r="10" fill="none" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="80" y1="176" x2="92" y2="188" stroke="#9CA3AF" stroke-width="2"/>
    <text x="100" y="176"
          font-family="'Pretendard', sans-serif"
          font-size="18" fill="#6B7280">강남구 대치동</text>

    <!-- 결과 행 4개 -->
    <g font-family="'Pretendard', sans-serif">
      <g transform="translate(40, 230)">
        <rect width="420" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" font-size="16" font-weight="600" fill="#1F2937">래미안 강남</text>
        <text x="20" y="48" font-size="13" fill="#6B7280">매매 18억 · 32평</text>
        <circle cx="380" cy="30" r="18" fill="#1E3A5F"/>
        <text x="380" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>
      <g transform="translate(40, 300)">
        <rect width="420" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" font-size="16" font-weight="600" fill="#1F2937">대치 푸르지오</text>
        <text x="20" y="48" font-size="13" fill="#6B7280">매매 22억 · 38평</text>
        <circle cx="380" cy="30" r="18" fill="#1E3A5F"/>
        <text x="380" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>
      <g transform="translate(40, 370)">
        <rect width="420" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" font-size="16" font-weight="600" fill="#1F2937">은마아파트</text>
        <text x="20" y="48" font-size="13" fill="#6B7280">매매 24억 · 31평</text>
        <circle cx="380" cy="30" r="18" fill="#1E3A5F"/>
        <text x="380" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>
      <g transform="translate(40, 440)">
        <rect width="420" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" font-size="16" font-weight="600" fill="#1F2937">선경아파트</text>
        <text x="20" y="48" font-size="13" fill="#6B7280">매매 19억 · 35평</text>
        <circle cx="380" cy="30" r="18" fill="#1E3A5F"/>
        <text x="380" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>
    </g>

    <text x="250" y="555" font-family="'Pretendard', sans-serif" font-size="14"
          fill="#B89968" text-anchor="middle" font-weight="600" letter-spacing="2">+ 4번 클릭</text>
  </g>

  <!-- 화살표 1 → 2 -->
  <g transform="translate(640, 580)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B89968" stroke-width="3"/>
    <polygon points="80,-8 96,0 80,8" fill="#B89968"/>
  </g>

  <!-- STEP 2: 플로팅 바 -->
  <g transform="translate(760, 280)" filter="url(#shadow)">
    <rect width="400" height="600" rx="20" fill="url(#card)" stroke="#E5E7EB"/>

    <circle cx="60" cy="60" r="32" fill="#1E3A5F"/>
    <text x="60" y="72" font-family="'Noto Serif KR', serif" font-size="32" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">2</text>

    <text x="120" y="72"
          font-family="'Pretendard', sans-serif"
          font-size="28" font-weight="700" fill="#1F2937">플로팅 바</text>

    <!-- 화면 mockup (배경) -->
    <rect x="40" y="140" width="320" height="380" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>

    <!-- 화면 안 콘텐츠 dimming -->
    <g opacity="0.4">
      <rect x="60" y="160" width="280" height="14" rx="4" fill="#9CA3AF"/>
      <rect x="60" y="184" width="220" height="10" rx="3" fill="#D1D5DB"/>
      <rect x="60" y="210" width="280" height="60" rx="6" fill="#E5E7EB"/>
      <rect x="60" y="280" width="280" height="60" rx="6" fill="#E5E7EB"/>
      <rect x="60" y="350" width="280" height="60" rx="6" fill="#E5E7EB"/>
      <rect x="60" y="420" width="180" height="14" rx="4" fill="#9CA3AF"/>
      <rect x="60" y="440" width="220" height="10" rx="3" fill="#D1D5DB"/>
    </g>

    <!-- 플로팅 바 -->
    <rect x="60" y="460" width="280" height="50" rx="25" fill="#1E3A5F"/>
    <text x="80" y="491"
          font-family="'Pretendard', sans-serif"
          font-size="16" font-weight="600" fill="#FFFFFF">
      비교 목록 (4/4)
    </text>
    <rect x="240" y="473" width="86" height="24" rx="12" fill="#B89968"/>
    <text x="283" y="490"
          font-family="'Pretendard', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">비교하기</text>

    <text x="200" y="555" font-family="'Pretendard', sans-serif" font-size="14"
          fill="#B89968" text-anchor="middle" font-weight="600" letter-spacing="2">최대 4개</text>
  </g>

  <!-- 화살표 2 → 3 -->
  <g transform="translate(1180, 580)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B89968" stroke-width="3"/>
    <polygon points="80,-8 96,0 80,8" fill="#B89968"/>
  </g>

  <!-- STEP 3: 24행 비교표 -->
  <g transform="translate(1300, 280)" filter="url(#shadow)">
    <rect width="500" height="600" rx="20" fill="url(#card)" stroke="#E5E7EB"/>

    <circle cx="60" cy="60" r="32" fill="#1E3A5F"/>
    <text x="60" y="72" font-family="'Noto Serif KR', serif" font-size="32" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">3</text>

    <text x="120" y="72"
          font-family="'Pretendard', sans-serif"
          font-size="28" font-weight="700" fill="#1F2937">24행 비교표</text>

    <!-- 표 헤더 -->
    <rect x="40" y="130" width="420" height="36" fill="#1E3A5F"/>
    <text x="60"  y="154" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">항목</text>
    <text x="180" y="154" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="270" y="154" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
    <text x="360" y="154" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="440" y="154" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text>

    <!-- 표 행 (24행 中 8행만 표시) -->
    <g font-family="'Pretendard', sans-serif" font-size="12" fill="#1F2937">
      <g transform="translate(40, 166)">
        <rect width="420" height="32" fill="#FFFFFF" stroke="#F3F4F6"/>
        <text x="20" y="20">세대수</text>
        <text x="140" y="20" text-anchor="middle">486</text>
        <text x="230" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★1,234</text>
        <text x="320" y="20" text-anchor="middle">920</text>
        <text x="400" y="20" text-anchor="middle">512</text>
      </g>
      <g transform="translate(40, 198)">
        <rect width="420" height="32" fill="#FAFAF7" stroke="#F3F4F6"/>
        <text x="20" y="20">최고층</text>
        <text x="140" y="20" text-anchor="middle">25</text>
        <text x="230" y="20" text-anchor="middle">28</text>
        <text x="320" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★35</text>
        <text x="400" y="20" text-anchor="middle">22</text>
      </g>
      <g transform="translate(40, 230)">
        <rect width="420" height="32" fill="#FFFFFF" stroke="#F3F4F6"/>
        <text x="20" y="20">총주차</text>
        <text x="140" y="20" text-anchor="middle">580</text>
        <text x="230" y="20" text-anchor="middle">1,400</text>
        <text x="320" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★1,500</text>
        <text x="400" y="20" text-anchor="middle">600</text>
      </g>
      <g transform="translate(40, 262)">
        <rect width="420" height="32" fill="#FAFAF7" stroke="#F3F4F6"/>
        <text x="20" y="20">평당가 ↓</text>
        <text x="140" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★5,800</text>
        <text x="230" y="20" text-anchor="middle">7,200</text>
        <text x="320" y="20" text-anchor="middle">8,100</text>
        <text x="400" y="20" text-anchor="middle">6,500</text>
      </g>
      <g transform="translate(40, 294)">
        <rect width="420" height="32" fill="#FFFFFF" stroke="#F3F4F6"/>
        <text x="20" y="20">매물수</text>
        <text x="140" y="20" text-anchor="middle">12</text>
        <text x="230" y="20" text-anchor="middle">28</text>
        <text x="320" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★45</text>
        <text x="400" y="20" text-anchor="middle">18</text>
      </g>
      <g transform="translate(40, 326)">
        <rect width="420" height="32" fill="#FAFAF7" stroke="#F3F4F6"/>
        <text x="20" y="20">전세가율</text>
        <text x="140" y="20" text-anchor="middle">62%</text>
        <text x="230" y="20" text-anchor="middle">68%</text>
        <text x="320" y="20" text-anchor="middle">65%</text>
        <text x="400" y="20" text-anchor="middle" fill="#B89968" font-weight="700">★71%</text>
      </g>
      <g transform="translate(40, 358)">
        <rect width="420" height="32" fill="#FFFFFF" stroke="#F3F4F6"/>
        <text x="20" y="20" fill="#9CA3AF">···</text>
        <text x="140" y="20" text-anchor="middle" fill="#9CA3AF">···</text>
        <text x="230" y="20" text-anchor="middle" fill="#9CA3AF">···</text>
        <text x="320" y="20" text-anchor="middle" fill="#9CA3AF">···</text>
        <text x="400" y="20" text-anchor="middle" fill="#9CA3AF">···</text>
      </g>
    </g>

    <!-- 차트 미니어처 (레이더 + 바) -->
    <g transform="translate(60, 410)">
      <!-- 레이더 -->
      <polygon points="80,0 140,40 140,100 80,140 20,100 20,40" fill="none" stroke="#D1D5DB"/>
      <polygon points="80,30 110,55 110,95 80,120 50,95 50,55" fill="#1E3A5F" fill-opacity="0.2" stroke="#1E3A5F"/>
      <polygon points="80,15 130,45 125,98 80,130 30,98 35,50" fill="#B89968" fill-opacity="0.25" stroke="#B89968"/>

      <!-- 막대 -->
      <g transform="translate(220, 0)">
        <rect x="0"  y="80" width="20" height="60" fill="#1E3A5F"/>
        <rect x="30" y="40" width="20" height="100" fill="#B89968"/>
        <rect x="60" y="60" width="20" height="80" fill="#1E3A5F"/>
        <rect x="90" y="20" width="20" height="120" fill="#B89968"/>
        <line x1="-5" y1="140" x2="120" y2="140" stroke="#9CA3AF"/>
      </g>
    </g>

    <text x="290" y="585" font-family="'Pretendard', sans-serif" font-size="14"
          fill="#B89968" text-anchor="middle" font-weight="600" letter-spacing="2">★ 우위 자동 표시</text>
  </g>

  <!-- 하단 캡션 -->
  <text x="960" y="990"
        font-family="'Pretendard', sans-serif"
        font-size="20" fill="#1F2937" text-anchor="middle" font-weight="500">
    30분 자료 → 5분으로
  </text>
</svg>
