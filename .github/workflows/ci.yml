name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Playwright 시각 회귀 baseline 갱신 (Linux). artifact 'updated-snapshots' 다운로드해서 커밋"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app

      - name: Compliance
        run: npm run check:ad-compliance

      - name: Mdx-JSX guard
        run: npm run check:mdx-jsx

      - name: Test
        run: npm test

  e2e:
    name: Frontend E2E (admin)
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (setup + admin + public + public-visual)
        run: npx playwright test --project=setup --project=admin --project=public --project=public-visual ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:9999

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-screenshots
          path: frontend/test-results
          retention-days: 14

      # workflow_dispatch + update_snapshots=true 일 때만 baseline 변경분 업로드
      # 다운로드 후 frontend/e2e/admin-dashboard.spec.ts-snapshots/ 에 풀어서 커밋
      - if: inputs.update_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: frontend/e2e/**/*-snapshots/**
          retention-days: 14

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libffi-dev

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax validation
        run: |
          python -c "
          import sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('.').rglob('*.py')):
              if '__pycache__' in str(f):
                  continue
              try:
                  compile(f.read_text(encoding='utf-8'), str(f), 'exec')
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          count = len([f for f in pathlib.Path('.').rglob('*.py') if '__pycache__' not in str(f)])
          print(f'All {count} Python files have valid syntax')
          "

      - name: Test
        run: |
          pip install pytest httpx
          python -m pytest
        env:
          DATABASE_URL: sqlite://
          SUPABASE_JWT_SECRET: test-ci-secret
