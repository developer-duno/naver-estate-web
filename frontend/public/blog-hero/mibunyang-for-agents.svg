<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="공인중개사 미분양 워크플로 — 5탭 정렬 7종 즐겨찾기 200개 17행 비교">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1E3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 좌측 큰 카피 영역 -->
  <text x="120" y="280"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1F2937" letter-spacing="-3">
    미분양 워크
  </text>
  <text x="120" y="400"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1A8A8A" letter-spacing="-3">
    공인중개사
  </text>
  <rect x="120" y="430" width="80" height="4" fill="#D4A574"/>
  <text x="120" y="510"
        font-family="'Pretendard', sans-serif"
        font-size="32" font-weight="400" fill="#4B5563">
    5탭 · 정렬 7종 · 즐겨찾기 200개
  </text>
  <text x="120" y="555"
        font-family="'Pretendard', sans-serif"
        font-size="28" font-weight="300" fill="#6B7280">
    17행 비교표로 매수 상담 자료 5분 정리
  </text>

  <!-- 좌측 하단 정렬 7종 텍스트 -->
  <g transform="translate(120, 700)">
    <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#1A8A8A" letter-spacing="2">정렬 7종</text>
    <text x="0" y="58" font-family="'Pretendard', sans-serif" font-size="15" fill="#4B5563">단지명 · 미분양 많은/적은순 · 미분양률</text>
    <text x="0" y="86" font-family="'Pretendard', sans-serif" font-size="15" fill="#4B5563">세대수 · 분양가 낮은/높은순</text>
  </g>

  <!-- 좌측 하단 즐겨찾기 박스 -->
  <g transform="translate(120, 820)">
    <rect x="0" y="0" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#D4A574" stroke-width="2"/>
    <text x="32" y="34" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#D4A574" letter-spacing="2">즐겨찾기</text>
    <text x="32" y="62" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#1F2937">최대 200개 · localStorage</text>
    <text x="380" y="50" font-family="'Pretendard', sans-serif" font-size="48" font-weight="700" fill="#D4A574">★</text>
  </g>

  <!-- 우측 5탭 + 비교표 mockup 카드 -->
  <g transform="translate(1050, 180)" filter="url(#shadow)">
    <!-- 카드 프레임 -->
    <rect x="0" y="0" width="720" height="720" rx="16" fill="url(#card)" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="720" height="60" rx="16" fill="#1A8A8A"/>
    <rect x="0" y="44" width="720" height="16" fill="#1A8A8A"/>
    <circle cx="32" cy="30" r="6" fill="#D4A574"/>
    <circle cx="56" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <text x="120" y="38"
          font-family="'Pretendard', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">
      /mibunyang · 5탭 워크플로
    </text>

    <!-- 5탭 영역 -->
    <g transform="translate(40, 96)">
      <!-- 활성 탭 (단지) -->
      <rect x="0" y="0" width="120" height="44" rx="8" fill="#1A8A8A"/>
      <text x="60" y="29" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">단지</text>

      <rect x="128" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="188" y="29" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">미분양</text>

      <rect x="256" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="316" y="29" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">지역</text>

      <rect x="384" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="444" y="29" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">실거래</text>

      <rect x="512" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="572" y="29" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">★ 즐겨찾기</text>
    </g>

    <!-- 17행 비교표 헤더 -->
    <g transform="translate(40, 168)">
      <rect x="0" y="0" width="640" height="40" fill="#1A8A8A" rx="4"/>
      <text x="20" y="26" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">17행 비교</text>
      <text x="200" y="26" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">A 단지</text>
      <text x="340" y="26" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">B 단지</text>
      <text x="480" y="26" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">C 단지</text>
      <text x="600" y="26" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text>
    </g>

    <!-- 17행 데이터 (6 행 + ··· 1 행) -->
    <g font-family="'Pretendard', sans-serif" fill="#1F2937" transform="translate(40, 208)">
      <rect x="0" y="0" width="640" height="36" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="20" y="24" font-size="14" font-weight="500" fill="#6B7280">세대수</text>
      <text x="200" y="24" font-size="15" text-anchor="middle">486</text>
      <text x="340" y="24" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★1,234</text>
      <text x="480" y="24" font-size="15" text-anchor="middle">920</text>
      <text x="600" y="24" font-size="15" text-anchor="middle">512</text>

      <rect x="0" y="36" width="640" height="36" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="20" y="60" font-size="14" font-weight="500" fill="#6B7280">미분양률 ↓</text>
      <text x="200" y="60" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★3%</text>
      <text x="340" y="60" font-size="15" text-anchor="middle">12%</text>
      <text x="480" y="60" font-size="15" text-anchor="middle">8%</text>
      <text x="600" y="60" font-size="15" text-anchor="middle">15%</text>

      <rect x="0" y="72" width="640" height="36" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="20" y="96" font-size="14" font-weight="500" fill="#6B7280">평당가 ↓</text>
      <text x="200" y="96" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★1,820</text>
      <text x="340" y="96" font-size="15" text-anchor="middle">2,400</text>
      <text x="480" y="96" font-size="15" text-anchor="middle">2,150</text>
      <text x="600" y="96" font-size="15" text-anchor="middle">1,950</text>

      <rect x="0" y="108" width="640" height="36" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="20" y="132" font-size="14" font-weight="500" fill="#6B7280">할인율</text>
      <text x="200" y="132" font-size="15" text-anchor="middle">8%</text>
      <text x="340" y="132" font-size="15" text-anchor="middle">12%</text>
      <text x="480" y="132" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★18%</text>
      <text x="600" y="132" font-size="15" text-anchor="middle">5%</text>

      <rect x="0" y="144" width="640" height="36" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="20" y="168" font-size="14" font-weight="500" fill="#6B7280">전세가율</text>
      <text x="200" y="168" font-size="15" text-anchor="middle">62%</text>
      <text x="340" y="168" font-size="15" text-anchor="middle">68%</text>
      <text x="480" y="168" font-size="15" text-anchor="middle">65%</text>
      <text x="600" y="168" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★71%</text>

      <rect x="0" y="180" width="640" height="36" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="20" y="204" font-size="14" font-weight="500" fill="#6B7280">주변시세</text>
      <text x="200" y="204" font-size="15" text-anchor="middle">5.2억</text>
      <text x="340" y="204" font-size="15" font-weight="700" fill="#D4A574" text-anchor="middle">★8.1억</text>
      <text x="480" y="204" font-size="15" text-anchor="middle">7.4억</text>
      <text x="600" y="204" font-size="15" text-anchor="middle">4.9억</text>

      <rect x="0" y="216" width="640" height="36" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="20" y="240" font-size="14" fill="#9CA3AF">··· 11행 더</text>
      <text x="200" y="240" font-size="14" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="340" y="240" font-size="14" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="480" y="240" font-size="14" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="600" y="240" font-size="14" fill="#9CA3AF" text-anchor="middle">···</text>
    </g>

    <!-- 결과 박스 (17행 우위 합계) -->
    <g transform="translate(40, 472)">
      <rect x="0" y="0" width="640" height="190" rx="12" fill="#1A8A8A"/>
      <text x="32" y="36"
            font-family="'Pretendard', sans-serif"
            font-size="14" font-weight="500" fill="#D4A574" letter-spacing="2">
        17행 우위 합계 · ★ 자동 표시
      </text>
      <g font-family="'Pretendard', sans-serif" fill="#FFFFFF">
        <text x="32" y="80" font-size="20" font-weight="700" fill="#D4A574">A · 6 ★</text>
        <text x="190" y="80" font-size="20" font-weight="600">B · 4 ★</text>
        <text x="340" y="80" font-size="20" font-weight="600">C · 4 ★</text>
        <text x="490" y="80" font-size="20" font-weight="600">D · 3 ★</text>
      </g>
      <text x="32" y="125" font-family="'Pretendard', sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">
        invert 3축 (미분양률·평당가·용적률) = lower better
      </text>
      <text x="32" y="155" font-family="'Pretendard', sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7">
        URL 공유 · 손님 카톡 한 줄로 응대
      </text>
    </g>
  </g>

  <!-- 하단 브랜드 -->
  <text x="120" y="1010"
        font-family="'Pretendard', sans-serif"
        font-size="20" font-weight="600" fill="#1A8A8A" letter-spacing="3">
    2u.pe.kr · 미분양 응대
  </text>
</svg>
