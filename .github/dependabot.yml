# Dependabot 자동 의존성 업데이트 — 무료(비공개 레포 포함). 세션 323 신설.
# 목적: 보안 advisory·버전 업데이트를 주1회 자동 PR. minor/patch 는 묶음(노이즈·Actions분 절약),
#       major 는 개별 PR 로 와도 머지는 사람이 판단(크롤링 핵심 의존성 curl_cffi 등은 상한 핀으로 자동 major 차단).
# 답습: .claude/rules 의 transitive 보안 핀 전략 + backend/requirements.txt 상한 핀(>=x,<y) 관행.
version: 2
updates:
  # 프론트엔드 (Next.js 16 / React 19 / TanStack Query 등)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      fe-minor-patch:
        update-types: ["minor", "patch"]
    # major 자동 차단 (세션 325) — 매주 재오픈+CI 실패 노이즈 방지. 근거는 메모리 실측.
    ignore:
      # eslint ^10 = React 플러그인 4종(react/react-hooks/jsx-a11y/import) peer 가 ^9 고정
      # → 강제 설치 시 런타임 깨짐. 플러그인 peer 출시 전 무의미 ([[project-eslint10-query-helpers-hold]]).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node ^23+ = 런타임 Node 22 LTS(engines node>=22) 보다 앞서가면 미존재 API 타입 노출.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # next 16.3.0 (minor) 이 admin E2E 를 3연속 깨뜨려(관리자 배지 로딩 10초 타임아웃)
      # PR #358 로 16.2.12 되돌림 (세션 361). @next/mdx 는 next 와 항상 짝 버전이어야
      # 하므로(다르면 세션 361 처럼 어긋남) 둘 다 같은 상한으로 차단 — update-types 로는
      # 특정 minor 버전 하나만 못 걸러 versions 필드 사용 (공식문서 확인, 세션 362).
      - dependency-name: "next"
        versions: [">=16.3.0"]
      - dependency-name: "@next/mdx"
        versions: [">=16.3.0"]
      # eslint-config-next 도 PR #358 에서 next 와 짝으로 묶어 취급하기로 한 패키지
      # (next 코어 의존은 없지만 @next/eslint-plugin-next 를 통해 next 버전과 나란히
      # 관리하는 관행) — 문서-설정 정합을 위해 동일 상한 적용 (세션 362 적대검증 발견).
      - dependency-name: "eslint-config-next"
        versions: [">=16.3.0"]
      # fullcalendar v7 = 단순 bump 가 아니라 패키지 구조 개편 — @fullcalendar/daygrid 가
      # 별도 패키지에서 사라지고 @fullcalendar/react/* entrypoint 로 통합(정식 v7 미출시,
      # 7.0.0-rc.0 까지만 존재). core 는 peer 제거·CSS 번들 제거·temporal-polyfill 추가라
      # dependabot 개별 PR(#365·#363) 머지 시 v6/v7 혼재로 빌드 깨짐 → 수동 마이그레이션
      # 전용으로 확정, major 자동 PR 차단 (세션 364).
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]

  # 백엔드 (FastAPI / curl_cffi / SQLAlchemy 등 — 상한 핀이 major 자동상승 차단)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      be-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions 워크플로 액션 버전 (actions/checkout 등)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
