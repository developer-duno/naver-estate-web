<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="미분양 단지 세 곳을 행마다 값만 나란히 놓은 비교표와 그 아래 자료 출처 한 줄, 읽는 순서 네 가지를 그린 그림">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#EDE0CC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E3A5F" flood-opacity="0.11"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <text x="960" y="120" font-family="'Noto Serif KR', serif" font-size="56" font-weight="700" fill="#1F2937" text-anchor="middle" letter-spacing="-2">17행 비교표 — 값만 나란히</text>
  <rect x="900" y="145" width="120" height="3" fill="#B89968"/>
  <text x="960" y="195" font-family="'Pretendard', sans-serif" font-size="22" fill="#6B7280" text-anchor="middle">판정 표시 없이 값을 보여 드리고, 자료 출처는 맨 아래 한 단락에</text>

  <!-- 좌측: 비교표 -->
  <g transform="translate(120, 250)" filter="url(#shadow)">
    <rect width="1080" height="760" rx="20" fill="url(#card)" stroke="#E5E7EB"/>
    <rect x="40" y="40" width="1000" height="54" fill="#F3F4F6"/>
    <text x="60" y="74.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#374151">항목</text>
    <text x="465.0" y="74.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 A</text>
    <text x="695.0" y="74.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 B</text>
    <text x="925.0" y="74.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#1A8A8A" text-anchor="middle">단지 C</text>
    <line x1="40" y1="94" x2="1040" y2="94" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="128.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">세대수</text>
    <text x="465.0" y="128.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">1,047</text>
    <text x="695.0" y="128.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">620</text>
    <text x="925.0" y="128.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">298</text>
    <rect x="40" y="148" width="1000" height="54" fill="#F9FAFB"/>
    <line x1="40" y1="148" x2="1040" y2="148" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="182.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">미분양</text>
    <text x="465.0" y="182.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">121</text>
    <text x="695.0" y="182.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">26</text>
    <text x="925.0" y="182.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">56</text>
    <line x1="40" y1="202" x2="1040" y2="202" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="236.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">미분양률(%)</text>
    <text x="465.0" y="236.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">11.6</text>
    <text x="695.0" y="236.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">4.2</text>
    <text x="925.0" y="236.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">18.9</text>
    <rect x="40" y="256" width="1000" height="54" fill="#F9FAFB"/>
    <line x1="40" y1="256" x2="1040" y2="256" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="290.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">6개월 취소율(%)</text>
    <text x="465.0" y="290.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">2.1</text>
    <text x="695.0" y="290.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">0.8</text>
    <text x="925.0" y="290.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">-</text>
    <line x1="40" y1="310" x2="1040" y2="310" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="344.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">분양가 최저(만원)</text>
    <text x="465.0" y="344.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">41,800</text>
    <text x="695.0" y="344.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">38,500</text>
    <text x="925.0" y="344.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">29,900</text>
    <rect x="40" y="364" width="1000" height="54" fill="#F9FAFB"/>
    <line x1="40" y1="364" x2="1040" y2="364" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="398.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">평당가(만원)</text>
    <text x="465.0" y="398.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">1,820</text>
    <text x="695.0" y="398.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">2,150</text>
    <text x="925.0" y="398.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">-</text>
    <line x1="40" y1="418" x2="1040" y2="418" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="452.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">세대당 주차(대)</text>
    <text x="465.0" y="452.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">1.2</text>
    <text x="695.0" y="452.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">1.05</text>
    <text x="925.0" y="452.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">0.9</text>
    <rect x="40" y="472" width="1000" height="54" fill="#F9FAFB"/>
    <line x1="40" y1="472" x2="1040" y2="472" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="506.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">최고층</text>
    <text x="465.0" y="506.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">34</text>
    <text x="695.0" y="506.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">25</text>
    <text x="925.0" y="506.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">29</text>
    <line x1="40" y1="526" x2="1040" y2="526" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="560.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">용적률(%)</text>
    <text x="465.0" y="560.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">214</text>
    <text x="695.0" y="560.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">249</text>
    <text x="925.0" y="560.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">199</text>
    <rect x="40" y="580" width="1000" height="54" fill="#F9FAFB"/>
    <line x1="40" y1="580" x2="1040" y2="580" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="614.56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#374151">큰 도로 거리(추정)</text>
    <text x="465.0" y="614.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">100~200m</text>
    <text x="695.0" y="614.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">50m 이내</text>
    <text x="925.0" y="614.56" font-family="'Pretendard', sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">200m 넘음</text>
    <line x1="350" y1="40" x2="350" y2="634" stroke="#E5E7EB" stroke-width="1"/>
    <text x="540" y="668" font-family="'Pretendard', sans-serif" font-size="17" fill="#9CA3AF" text-anchor="middle">··· 7행 더 (입주시기 · 분양가 최고 · 난방 · 시공사 · 할인율 등)</text>
    <line x1="40" y1="690" x2="1040" y2="690" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="720" font-family="'Pretendard', sans-serif" font-size="16" fill="#6B7280">출처: 국토교통부 실거래가 공개시스템 · 국토교통부 미분양주택현황 · 공동주택관리정보시스템(K-apt) · 에어코리아(환경부)</text>
    <text x="40" y="745" font-family="'Pretendard', sans-serif" font-size="16" fill="#6B7280">네이버부동산(단지 정보) · 미분양 사업자 자료 / 법령: 국가법령정보센터</text>
  </g>

  <!-- 우측: 읽는 순서 -->
  <g transform="translate(1280, 250)">
    <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#1A8A8A">읽는 순서</text>
        <rect x="0" y="40" width="520" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="0" y="40" width="8" height="120" rx="4" fill="#1A8A8A"/>
    <text x="32" y="92" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#1F2937">같은 행끼리만 견줍니다</text>
    <text x="32" y="128" font-family="'Pretendard', sans-serif" font-size="17" fill="#6B7280">행마다 단위가 달라 하나의 점수로 합치지 않습니다</text>
    <rect x="0" y="190" width="520" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="0" y="190" width="8" height="120" rx="4" fill="#1A8A8A"/>
    <text x="32" y="242" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#1F2937">'-' 는 자료 없음</text>
    <text x="32" y="278" font-family="'Pretendard', sans-serif" font-size="17" fill="#6B7280">평당가 미공개를 0원으로 읽지 않게 비워 둡니다</text>
    <rect x="0" y="340" width="520" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="0" y="340" width="8" height="120" rx="4" fill="#1A8A8A"/>
    <text x="32" y="392" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#1F2937">큰 도로 거리는 추정</text>
    <text x="32" y="428" font-family="'Pretendard', sans-serif" font-size="17" fill="#6B7280">소음 측정값이 아니라 도로까지 거리 구간입니다</text>
    <rect x="0" y="490" width="520" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="0" y="490" width="8" height="120" rx="4" fill="#1A8A8A"/>
    <text x="32" y="542" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#1F2937">법정 기준은 상세 화면</text>
    <text x="32" y="578" font-family="'Pretendard', sans-serif" font-size="17" fill="#6B7280">세대수 300 · 주차 1대 등 기준 한 줄이 붙습니다</text>
  </g>
</svg>
