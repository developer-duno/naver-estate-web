<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="단지 비교 화면 — 4개 단지 24행 비교, ★ 우위 자동 표시">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1E3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 좌측 큰 카피 영역 -->
  <text x="120" y="280"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1F2937" letter-spacing="-3">
    단지 비교
  </text>
  <text x="120" y="400"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1E3A5F" letter-spacing="-3">
    한 화면에
  </text>
  <rect x="120" y="430" width="80" height="4" fill="#B89968"/>
  <text x="120" y="510"
        font-family="'Pretendard', sans-serif"
        font-size="32" font-weight="400" fill="#4B5563">
    4개 단지 24행 비교표 · ★ 우위 자동 표시
  </text>
  <text x="120" y="555"
        font-family="'Pretendard', sans-serif"
        font-size="28" font-weight="300" fill="#6B7280">
    세대수 · 평당가 · 주차 · 전세가율 한눈에
  </text>

  <!-- 우측 비교표 mockup 카드 -->
  <g transform="translate(1050, 220)" filter="url(#shadow)">
    <!-- 카드 프레임 -->
    <rect x="0" y="0" width="720" height="640" rx="16" fill="url(#card)" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="720" height="60" rx="16" fill="#1E3A5F"/>
    <rect x="0" y="44" width="720" height="16" fill="#1E3A5F"/>
    <circle cx="32" cy="30" r="6" fill="#B89968"/>
    <circle cx="56" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <text x="120" y="38"
          font-family="'Pretendard', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">
      /compare?ids=12345,67890,11111,22222
    </text>

    <!-- 비교표 헤더 행 -->
    <rect x="40" y="100" width="640" height="48" fill="#1E3A5F"/>
    <text x="60" y="130" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">항목</text>
    <text x="240" y="130" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="380" y="130" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
    <text x="520" y="130" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="660" y="130" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text>

    <!-- 비교 행 4개 (대표) -->
    <g font-family="'Pretendard', sans-serif" fill="#1F2937">
      <rect x="40" y="148" width="640" height="48" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="60" y="178" font-size="16" font-weight="500" fill="#6B7280">세대수</text>
      <text x="240" y="178" font-size="18" text-anchor="middle">486</text>
      <text x="380" y="178" font-size="18" font-weight="700" fill="#B89968" text-anchor="middle">★1,234</text>
      <text x="520" y="178" font-size="18" text-anchor="middle">920</text>
      <text x="660" y="178" font-size="18" text-anchor="middle">512</text>

      <rect x="40" y="196" width="640" height="48" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="60" y="226" font-size="16" font-weight="500" fill="#6B7280">최고층</text>
      <text x="240" y="226" font-size="18" text-anchor="middle">25</text>
      <text x="380" y="226" font-size="18" text-anchor="middle">28</text>
      <text x="520" y="226" font-size="18" font-weight="700" fill="#B89968" text-anchor="middle">★35</text>
      <text x="660" y="226" font-size="18" text-anchor="middle">22</text>

      <rect x="40" y="244" width="640" height="48" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="60" y="274" font-size="16" font-weight="500" fill="#6B7280">평당가 ↓</text>
      <text x="240" y="274" font-size="18" font-weight="700" fill="#B89968" text-anchor="middle">★5,800</text>
      <text x="380" y="274" font-size="18" text-anchor="middle">7,200</text>
      <text x="520" y="274" font-size="18" text-anchor="middle">8,100</text>
      <text x="660" y="274" font-size="18" text-anchor="middle">6,500</text>

      <rect x="40" y="292" width="640" height="48" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="60" y="322" font-size="16" font-weight="500" fill="#6B7280">전세가율</text>
      <text x="240" y="322" font-size="18" text-anchor="middle">62%</text>
      <text x="380" y="322" font-size="18" text-anchor="middle">68%</text>
      <text x="520" y="322" font-size="18" text-anchor="middle">65%</text>
      <text x="660" y="322" font-size="18" font-weight="700" fill="#B89968" text-anchor="middle">★71%</text>

      <rect x="40" y="340" width="640" height="48" fill="#FFFFFF" stroke="#F3F4F6"/>
      <text x="60" y="370" font-size="16" font-weight="500" fill="#6B7280">총주차</text>
      <text x="240" y="370" font-size="18" text-anchor="middle">580</text>
      <text x="380" y="370" font-size="18" text-anchor="middle">1,400</text>
      <text x="520" y="370" font-size="18" font-weight="700" fill="#B89968" text-anchor="middle">★1,500</text>
      <text x="660" y="370" font-size="18" text-anchor="middle">600</text>

      <rect x="40" y="388" width="640" height="48" fill="#FAFAF7" stroke="#F3F4F6"/>
      <text x="60" y="418" font-size="16" fill="#9CA3AF">···</text>
      <text x="240" y="418" font-size="16" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="380" y="418" font-size="16" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="520" y="418" font-size="16" fill="#9CA3AF" text-anchor="middle">···</text>
      <text x="660" y="418" font-size="16" fill="#9CA3AF" text-anchor="middle">···</text>
    </g>

    <!-- 결과 박스 -->
    <rect x="40" y="460" width="640" height="150" rx="12" fill="#1E3A5F"/>
    <text x="60" y="495"
          font-family="'Pretendard', sans-serif"
          font-size="14" font-weight="500" fill="#B89968" letter-spacing="2">
      24행 우위 합계 · ★ 자동 표시
    </text>
    <g font-family="'Pretendard', sans-serif" fill="#FFFFFF">
      <text x="60" y="540" font-size="20" font-weight="600">A · 1 ★</text>
      <text x="220" y="540" font-size="20" font-weight="600">B · 1 ★</text>
      <text x="380" y="540" font-size="20" font-weight="700" fill="#B89968">C · 2 ★</text>
      <text x="540" y="540" font-size="20" font-weight="600">D · 1 ★</text>
    </g>
    <text x="60" y="585" font-family="'Pretendard', sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7">
      평당가 lower better, 그 외 11 항목 higher better
    </text>
  </g>

  <!-- 하단 브랜드 -->
  <text x="120" y="1010"
        font-family="'Pretendard', sans-serif"
        font-size="20" font-weight="600" fill="#1E3A5F" letter-spacing="3">
    2u.pe.kr · 도구 활용
  </text>
</svg>
