<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="공인중개사를 위한 부동산 인사이트 — 2u부동산 블로그">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B89968" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B89968" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect y="380" width="1200" height="250" fill="url(#haze)"/>

  <!-- 도시 스카이라인 실루엣 -->
  <g fill="url(#skyline)">
    <rect x="0"    y="430" width="80"  height="200"/>
    <rect x="80"   y="380" width="60"  height="250"/>
    <rect x="140"  y="410" width="90"  height="220"/>
    <rect x="230"  y="350" width="70"  height="280"/>
    <rect x="300"  y="395" width="55"  height="235"/>
    <rect x="355"  y="330" width="100" height="300"/>
    <rect x="455"  y="370" width="65"  height="260"/>
    <rect x="520"  y="310" width="85"  height="320"/>
    <rect x="605"  y="360" width="75"  height="270"/>
    <rect x="680"  y="290" width="110" height="340"/>
    <rect x="790"  y="340" width="70"  height="290"/>
    <rect x="860"  y="380" width="60"  height="250"/>
    <rect x="920"  y="320" width="95"  height="310"/>
    <rect x="1015" y="370" width="65"  height="260"/>
    <rect x="1080" y="400" width="80"  height="230"/>
    <rect x="1160" y="360" width="40"  height="270"/>
  </g>

  <!-- 타워 첨탑 강조 -->
  <polygon points="405,330 415,290 425,330" fill="#1E3A5F"/>
  <polygon points="730,290 745,240 760,290" fill="#1E3A5F"/>

  <!-- 창문 점 패턴 (gold accent) -->
  <g fill="#B89968" opacity="0.55">
    <rect x="380" y="370" width="6" height="6"/>
    <rect x="395" y="385" width="6" height="6"/>
    <rect x="410" y="370" width="6" height="6"/>
    <rect x="425" y="400" width="6" height="6"/>
    <rect x="540" y="350" width="6" height="6"/>
    <rect x="560" y="340" width="6" height="6"/>
    <rect x="580" y="370" width="6" height="6"/>
    <rect x="700" y="320" width="6" height="6"/>
    <rect x="720" y="335" width="6" height="6"/>
    <rect x="745" y="320" width="6" height="6"/>
    <rect x="765" y="350" width="6" height="6"/>
    <rect x="940" y="350" width="6" height="6"/>
    <rect x="960" y="365" width="6" height="6"/>
    <rect x="985" y="350" width="6" height="6"/>
  </g>

  <!-- 메인 카피 (명조체 한국어) -->
  <text x="80" y="180"
        font-family="'Noto Serif KR', 'Nanum Myeongjo', serif"
        font-size="72" font-weight="700" fill="#1F2937" letter-spacing="-2">
    공인중개사를 위한
  </text>
  <text x="80" y="270"
        font-family="'Noto Serif KR', 'Nanum Myeongjo', serif"
        font-size="72" font-weight="700" fill="#1E3A5F" letter-spacing="-2">
    부동산 인사이트
  </text>

  <!-- 부제 -->
  <text x="80" y="320"
        font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
        font-size="22" font-weight="400" fill="#4B5563">
    시세 분석 · 세금 계산 · 미분양 활용법까지, 실무에 바로 쓰는 14편
  </text>

  <!-- 골드 underbar -->
  <rect x="80" y="345" width="60" height="3" fill="#B89968"/>

  <!-- 브랜드 -->
  <text x="80" y="595"
        font-family="'Pretendard', sans-serif"
        font-size="18" font-weight="600" fill="#1E3A5F" letter-spacing="2">
    2u.pe.kr · 부동산
  </text>
</svg>
