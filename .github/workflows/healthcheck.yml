# 외부 uptime 모니터 (무료, SaaS 미사용)
#
# 목적: 집 서버가 완전히 죽으면(정전/OS 크래시/네트워크 단절) 내부 워치독도
# 함께 죽어 알림을 못 보낸다. 이 워크플로우는 GitHub Actions 인프라(집 서버와
# 무관)에서 매일 1회(05:30 KST) 심층 헬스체크(/health/db, DB 연결까지 확인)를
# 호출해 서버·DB 생사를 외부에서 감시한다.
#
# 주기 = 매일 1회 (2026-08-02 세션, 10분 → 일 1회 격하 — 사장님 결정).
#   05:30 KST(=20:30 UTC)는 매일 새벽 ~05:00 재부팅 직후 — 터널이 재부팅에서
#   못 살아난 것을 그날 아침 잡기 위한 시각.
#
# ⚠ 격하 사유였던 "Actions 무료 한도 소진"은 **거짓 전제였다** (2026-09-11 세션 398
#   적대검증 실측 확정). 옛 주석은 "10분 간격이 월 4,300분+로 무료 한도(월 2,000분)를
#   2배 태워 7/13 소진 → CI·감시 월말까지 마비"였으나:
#     · 이 레포는 **public** — `gh api repos/developer-duno/naver-estate-web --jq .visibility`
#       → `public` (2026-03-12 생성 이래). **public 레포의 GitHub-hosted runner 는 무료·무제한**이라
#       2,000분 쿼터 자체가 적용되지 않는다.
#       (docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions)
#     · 실측으로도 최근 run 의 `/timing` `billable.UBUNTU.total_ms` 가 **전부 0**.
#     · "7/13 소진 → CI 마비"도 사실이 아니다 — 7/13~7/20 창을 `gh api --paginate` 로 나열하면
#       CI·dependabot 이 정상 실행됐고, 같은 창 Health Check 는 **306 failure + 5 success**.
#       쿼터 차단이 아니라 **대상(터널)이 실제로 죽어 있었고 감시는 정확히 포착 중**이었다.
#
#   → **비용 제약이 없으므로 일 1회 유지의 근거가 사라졌다.** 현재 최대 24시간 통지 지연은
#     근거 없는 손실이다. 단 UptimeRobot 5분 감시(infra.md §DB 크래시 처방)가 그 공백을
#     이미 메우고 있는지 먼저 확인해 **중복 여부를 판단한 뒤** 주기 상향을 사장님께 재문의할 것
#     (백로그 §12 V1). 같은 정정이 `.claude/rules/infra.md` §관찰성 인프라 에도 반영돼 있다.
#
# 403 구분 알림 (2026-08-09 세션): Cloudflare Bot Fight 모드가 켜지면 GH runner
# (미국 데이터센터 IP + curl)가 관리 챌린지를 못 풀어 403 — 서버는 멀쩡한데 오탐이
# 난다. 그래서 HTTP 코드를 캡처해 403 은 "엣지 차단 의심"으로 따로 알린다.
#
# 운영자 설정 필수: 저장소 Settings → Secrets and variables → Actions 에
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 두 시크릿을 등록해야 실패 시 알림이 간다.
# 시크릿 미설정이어도 워크플로우 자체는 안전하게 동작한다(알림만 스킵).

name: Health Check

on:
  schedule:
    - cron: '30 20 * * *'  # 매일 20:30 UTC = 05:30 KST (새벽 재부팅 직후 1회)
  workflow_dispatch:

jobs:
  check:
    name: External health ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        id: ping
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 https://api.2u.pe.kr/health/db) || code="000"
          echo "HTTP $code"
          cat body.txt 2>/dev/null || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      # 실패 시에만 실행. secrets 는 if: 에서 쓸 수 없으므로(GitHub 공식: step/job if
      # 컨텍스트에 secrets 미포함) env 로 주입해 shell 안에서 미설정(fork 등)을 판정한다.
      # 토큰 하드코딩 없음. 미설정이면 조용히 스킵(exit 0), 배포/알림 실패는 다음 스텝이 처리.
      - name: Send Telegram alert on failure
        continue-on-error: true
        if: ${{ steps.ping.outputs.healthy == 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTP_CODE: ${{ steps.ping.outputs.code }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM secrets 미설정 — 알림 스킵"
            exit 0
          fi
          if [ "$HTTP_CODE" = "403" ]; then
            MSG="[외부감시] ⚠ 헬스체크 403 — 서버 다운 아님, Cloudflare 엣지 차단 가능성(Bot Fight 모드 등 보안설정 확인, infra.md §관찰성)"
          else
            MSG="[외부감시] 🚨 naver-estate-web 헬스체크 실패 (HTTP ${HTTP_CODE}): https://api.2u.pe.kr/health/db 응답 없음 또는 비정상 — 집서버·터널·DB 점검 필요"
          fi
          curl -fsS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}"

      # Actions 탭에서도 실패가 보이도록(두 번째 신호) — 알림 성공/스킵 여부와 무관하게 실패 처리
      - name: Fail the job if unhealthy
        if: ${{ steps.ping.outputs.healthy == 'false' }}
        run: exit 1
