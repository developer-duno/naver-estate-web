<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="13축 레이더와 프리셋 3종을 비교해 손님 성향별 우위 단지가 점수로 뒤집히는 시각 자료">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#EDE0CC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 타이틀 -->
  <text x="960" y="120"
        font-family="'Noto Serif KR', serif"
        font-size="56" font-weight="700" fill="#1F2937" text-anchor="middle" letter-spacing="-2">
    13축 레이더 + 가중치 프리셋 3종
  </text>
  <rect x="900" y="145" width="120" height="3" fill="#B89968"/>
  <text x="960" y="195"
        font-family="'Pretendard', sans-serif"
        font-size="22" fill="#6B7280" text-anchor="middle">
    프리셋만 바꿔도 우위 단지가 한 줄로 뒤집힙니다
  </text>

  <!-- ===================== 좌측: 13축 레이더 ===================== -->
  <g transform="translate(120, 280)" filter="url(#shadow)">
    <rect width="720" height="660" rx="20" fill="url(#card)" stroke="#E5E7EB"/>

    <text x="40" y="60"
          font-family="'Pretendard', sans-serif"
          font-size="24" font-weight="700" fill="#1F2937">13축 레이더 (균등 프리셋)</text>
    <text x="40" y="90"
          font-family="'Pretendard', sans-serif"
          font-size="14" fill="#6B7280">기본 9축 + 인프라 4축, 멀리 뻗을수록 좋은 단지</text>

    <!-- 레이더 중심 (360, 380) -->
    <g transform="translate(360, 380)">
      <!-- 13축 라벨 위치 (반지름 270, 시계방향 12시부터 13개 균등 분할 약 27.7도) -->
      <!-- 격자 4겹 (25/50/75/100%) -->
      <g fill="none" stroke="#E5E7EB" stroke-width="1">
        <polygon points="0,-67 32,-59 60,-29 65,12 47,49 13,66 -13,66 -47,49 -65,12 -60,-29 -32,-59 -22,-63 11,-67"/>
        <polygon points="0,-135 65,-118 120,-58 130,24 95,98 27,133 -27,133 -95,98 -130,24 -120,-58 -65,-118 -45,-127 22,-135"/>
        <polygon points="0,-202 97,-177 180,-87 195,36 142,147 40,199 -40,199 -142,147 -195,36 -180,-87 -97,-177 -67,-190 33,-202"/>
        <polygon points="0,-270 130,-236 240,-116 260,48 190,196 53,266 -53,266 -190,196 -260,48 -240,-116 -130,-236 -90,-254 45,-270"/>
      </g>
      <!-- 13축 선 -->
      <g stroke="#E5E7EB" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="-270"/>
        <line x1="0" y1="0" x2="130" y2="-236"/>
        <line x1="0" y1="0" x2="240" y2="-116"/>
        <line x1="0" y1="0" x2="260" y2="48"/>
        <line x1="0" y1="0" x2="190" y2="196"/>
        <line x1="0" y1="0" x2="53" y2="266"/>
        <line x1="0" y1="0" x2="-53" y2="266"/>
        <line x1="0" y1="0" x2="-190" y2="196"/>
        <line x1="0" y1="0" x2="-260" y2="48"/>
        <line x1="0" y1="0" x2="-240" y2="-116"/>
        <line x1="0" y1="0" x2="-130" y2="-236"/>
        <line x1="0" y1="0" x2="-90" y2="-254"/>
        <line x1="0" y1="0" x2="45" y2="-270"/>
      </g>
      <!-- 데이터 폴리곤: 단지 A (균등 적용 모양) -->
      <polygon points="0,-202 110,-200 195,-94 210,39 142,147 36,180 -32,160 -130,135 -195,36 -150,-72 -65,-118 -50,-141 22,-135"
               fill="#1E3A5F" fill-opacity="0.18" stroke="#1E3A5F" stroke-width="2"/>
      <!-- 데이터 폴리곤: 단지 B -->
      <polygon points="0,-135 130,-236 180,-87 130,24 95,98 53,266 -27,133 -95,98 -130,24 -120,-58 -97,-177 -45,-127 33,-202"
               fill="#B89968" fill-opacity="0.20" stroke="#B89968" stroke-width="2"/>
      <!-- 축 라벨 -->
      <g font-family="'Pretendard', sans-serif" font-size="11" fill="#4B5563" text-anchor="middle">
        <text x="0" y="-285">세대수</text>
        <text x="143" y="-244">주차</text>
        <text x="262" y="-118">최고층</text>
        <text x="282" y="54">전세가율</text>
        <text x="206" y="214">주변시세</text>
        <text x="58" y="285">할인율</text>
        <text x="-58" y="285">미분양↓</text>
        <text x="-206" y="214">평당가↓</text>
        <text x="-282" y="54">용적률↓</text>
        <text x="-262" y="-118">대기질</text>
        <text x="-143" y="-244">의료</text>
        <text x="-99" y="-264">보육</text>
        <text x="56" y="-281">치안</text>
      </g>
    </g>

    <!-- 범례 -->
    <g transform="translate(40, 600)" font-family="'Pretendard', sans-serif" font-size="14" fill="#1F2937">
      <rect x="0"  y="0" width="14" height="14" fill="#1E3A5F" fill-opacity="0.5"/>
      <text x="22" y="12">단지 A</text>
      <rect x="120" y="0" width="14" height="14" fill="#B89968" fill-opacity="0.5"/>
      <text x="142" y="12">단지 B</text>
      <text x="500" y="12" fill="#6B7280" text-anchor="end">멀리 뻗을수록 좋은 단지</text>
    </g>
  </g>

  <!-- ===================== 우측: 프리셋 3종 점수 뒤집힘 ===================== -->
  <g transform="translate(880, 280)" filter="url(#shadow)">
    <rect width="920" height="660" rx="20" fill="url(#card)" stroke="#E5E7EB"/>

    <text x="40" y="60"
          font-family="'Pretendard', sans-serif"
          font-size="24" font-weight="700" fill="#1F2937">프리셋 3종 → 점수 뒤집힘</text>
    <text x="40" y="90"
          font-family="'Pretendard', sans-serif"
          font-size="14" fill="#6B7280">손님 성향별로 가중치를 한 번 누르면 종합 우위가 바뀝니다</text>

    <!-- 3 단지 종합 점수 막대 그래프 -->
    <g transform="translate(40, 130)">

      <!-- 프리셋 1: 균등 -->
      <g transform="translate(0, 0)">
        <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1F2937">균등 (모두 3)</text>
        <text x="0" y="42" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280">객관 비교 · 포트폴리오 다각화 손님</text>
        <!-- 막대 3개 -->
        <g transform="translate(180, 0)">
          <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 A</text>
          <rect x="60" y="6" width="288" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="6" width="288" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.85"/>
          <text x="360" y="20" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">72점</text>

          <text x="0" y="48" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 B</text>
          <rect x="60" y="34" width="312" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="34" width="312" height="18" rx="4" fill="#B89968"/>
          <text x="384" y="48" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#B89968">★78점</text>

          <text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 C</text>
          <rect x="60" y="62" width="260" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="62" width="260" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.5"/>
          <text x="332" y="76" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">65점</text>
        </g>
      </g>

      <line x1="0" y1="120" x2="840" y2="120" stroke="#F3F4F6"/>

      <!-- 프리셋 2: 투자형 -->
      <g transform="translate(0, 140)">
        <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1F2937">투자형</text>
        <text x="0" y="42" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280">전세가율·주변시세·할인율 5 · 임대수익/시세차익</text>
        <g transform="translate(180, 0)">
          <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 A</text>
          <rect x="60" y="6" width="232" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="6" width="232" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.85"/>
          <text x="304" y="20" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">58점</text>

          <text x="0" y="48" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 B</text>
          <rect x="60" y="34" width="340" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="34" width="340" height="18" rx="4" fill="#B89968"/>
          <text x="412" y="48" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#B89968">★85점</text>

          <text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 C</text>
          <rect x="60" y="62" width="200" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="62" width="200" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.5"/>
          <text x="272" y="76" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">50점</text>
        </g>
      </g>

      <line x1="0" y1="260" x2="840" y2="260" stroke="#F3F4F6"/>

      <!-- 프리셋 3: 실거주형 -->
      <g transform="translate(0, 280)">
        <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#1F2937">실거주형</text>
        <text x="0" y="42" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280">주차 5 · 의료 5 · 보육 5 · 거주 쾌적성</text>
        <g transform="translate(180, 0)">
          <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 A</text>
          <rect x="60" y="6" width="320" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="6" width="320" height="18" rx="4" fill="#B89968"/>
          <text x="392" y="20" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#B89968">★80점</text>

          <text x="0" y="48" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 B</text>
          <rect x="60" y="34" width="264" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="34" width="264" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.7"/>
          <text x="336" y="48" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">66점</text>

          <text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="14" fill="#4B5563">단지 C</text>
          <rect x="60" y="62" width="216" height="18" rx="4" fill="#E5E7EB"/>
          <rect x="60" y="62" width="216" height="18" rx="4" fill="#1E3A5F" fill-opacity="0.5"/>
          <text x="288" y="76" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">54점</text>
        </g>
      </g>
    </g>

    <!-- 우위 변화 캡션 -->
    <g transform="translate(40, 600)">
      <rect x="0" y="0" width="840" height="36" rx="6" fill="#FBF6EE" stroke="#B89968" stroke-opacity="0.4"/>
      <text x="420" y="23"
            font-family="'Pretendard', sans-serif"
            font-size="14" fill="#1F2937" text-anchor="middle">
        ★ 우위: 단지 B (균등·투자형) → 단지 A (실거주형) — 같은 단지도 손님 성향에 따라 점수가 뒤집힙니다
      </text>
    </g>
  </g>

  <!-- 하단 캡션 -->
  <text x="960" y="1010"
        font-family="'Pretendard', sans-serif"
        font-size="20" fill="#1F2937" text-anchor="middle" font-weight="500">
    가중치 한 번이면 “★ 종합 우위 78점” 한 줄 답이 됩니다
  </text>
</svg>
