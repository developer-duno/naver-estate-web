name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Playwright 시각 회귀 baseline 갱신 (Linux). artifact 'updated-snapshots' 다운로드해서 커밋"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# paths-filter 가 pull_request 이벤트에서 변경 파일 목록을 GitHub API 로
# 조회할 때 pull-requests: read 권한이 필요하다. permissions 블록을
# 명시하면 그 외 권한은 모두 none 으로 축소된다 (최소 권한 원칙).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # npm audit — package-lock.json 보안 advisory 검사 (BE pip-audit 과 대칭)
      # --omit=dev = 배포 앱 prod 의존성만 (dev 도구 취약점 노이즈 방지)
      # --audit-level=high = high·critical 만 실패 (moderate 이하는 dependabot 이 별도 PR 처리)
      # 오탐 발생 시 = package.json overrides 로 버전 고정 (npm audit 은 per-advisory ignore 플래그 없음, 세션 339)
      - name: Security audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app

      - name: Compliance
        run: npm run check:ad-compliance

      - name: Mdx-JSX guard
        run: npm run check:mdx-jsx

      - name: Test
        run: npm test

  # setup+admin+public+public-visual 4 project 를 한 job 에서 순차 실행하면
  # 대기시간이 길다(public-visual 이 특히 무거움). GitHub Actions matrix 로
  # 3 project(admin/public/public-visual)를 병렬 job 으로 쪼개 대기시간을 줄인다
  # (세션 352). admin 은 setup 산출물(storageState)이 필요하므로 별도 job 에서
  # 먼저 만들어 artifact 로 넘긴다. public·public-visual 은 인증 불필요라 setup
  # 과 무관하게 동시 시작.
  e2e-setup:
    name: E2E setup (admin auth)
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      auth-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run setup (admin auth)
        run: npx playwright test --project=setup
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:9999

      # secrets 미설정 시 setup 이 skip 되어 admin.json 이 안 생긴다 — 그 경우
      # admin job 이 storageState 없이 실행되지 않도록 존재 여부를 다음 job 에 전달.
      - id: check
        run: |
          if [ -f "e2e/.auth/admin.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-state
          path: frontend/e2e/.auth/admin.json
          retention-days: 1

  e2e:
    name: Frontend E2E (${{ matrix.project }})
    needs: [changes, frontend, e2e-setup]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [admin, public, public-visual]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - if: matrix.project == 'admin' && needs.e2e-setup.outputs.auth-exists == 'true'
        uses: actions/download-artifact@v7
        with:
          name: admin-auth-state
          path: frontend/e2e/.auth

      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:9999

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 14

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-screenshots-${{ matrix.project }}
          path: frontend/test-results
          retention-days: 14

      # workflow_dispatch + update_snapshots=true 일 때만 baseline 변경분 업로드
      # 다운로드 후 frontend/e2e/admin-dashboard.spec.ts-snapshots/ 에 풀어서 커밋
      # always() 필수 — Run E2E step 이 snapshot 갱신 시 실패해도 artifact 는 받아야 함
      - if: always() && inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots-${{ matrix.project }}
          path: frontend/e2e/**/*-snapshots/**
          retention-days: 14

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libffi-dev

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      # pip-audit — requirements.txt 보안 advisory 검사 (Python 공식 OSV·PyPI Advisory DB)
      # MAL-2026-4750 = fastapi 0.136.3 [standard] extra 의 fastar typosquat. 우리는
      # base 의존성만 설치하므로 (extra 미사용) 실제 영향 0. fix 버전 없음 (2026-05-27 기준).
      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --ignore-vuln MAL-2026-4750

      - name: Syntax validation
        run: |
          python -c "
          import sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('.').rglob('*.py')):
              if '__pycache__' in str(f):
                  continue
              try:
                  compile(f.read_text(encoding='utf-8'), str(f), 'exec')
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          count = len([f for f in pathlib.Path('.').rglob('*.py') if '__pycache__' not in str(f)])
          print(f'All {count} Python files have valid syntax')
          "

      - name: Test
        run: |
          pip install pytest httpx pytest-xdist
          python -m pytest -n auto
        env:
          DATABASE_URL: sqlite://
          SUPABASE_JWT_SECRET: test-ci-secret
