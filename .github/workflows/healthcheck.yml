# 외부 uptime 모니터 (무료, SaaS 미사용)
#
# 목적: 집 서버가 완전히 죽으면(정전/OS 크래시/네트워크 단절) 내부 워치독도
# 함께 죽어 알림을 못 보낸다. 이 워크플로우는 GitHub Actions 인프라(집 서버와
# 무관)에서 매일 1회(05:30 KST) 심층 헬스체크(/health/db, DB 연결까지 확인)를
# 호출해 서버·DB 생사를 외부에서 감시한다.
#
# 주기 = 매일 1회 고정 (2026-08-02 세션, 10분 → 일 1회 격하 — 사장님 결정):
#   10분 간격은 월 4,300분+로 Actions 무료 한도(월 2,000분)의 2배를 태워
#   2026-07-13경 한도 소진 → 모든 CI·감시가 월말까지 마비됐다(감시가 먼저 죽어
#   7/18 터널 사망을 아무도 못 봄). 05:30 KST(=20:30 UTC)는 매일 새벽 ~05:00
#   재부팅 직후 — 터널이 재부팅에서 못 살아난 것을 그날 아침 잡기 위한 시각.
#   트레이드오프: 장애 인지가 최대 24시간 지연될 수 있음(한도 보호가 우선).
#
# 운영자 설정 필수: 저장소 Settings → Secrets and variables → Actions 에
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 두 시크릿을 등록해야 실패 시 알림이 간다.
# 시크릿 미설정이어도 워크플로우 자체는 안전하게 동작한다(알림만 스킵).

name: Health Check

on:
  schedule:
    - cron: '30 20 * * *'  # 매일 20:30 UTC = 05:30 KST (새벽 재부팅 직후 1회)
  workflow_dispatch:

jobs:
  check:
    name: External health ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        id: ping
        run: |
          if curl -fsS --max-time 20 https://api.2u.pe.kr/health/db; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      # 실패 시에만 실행. secrets 는 if: 에서 쓸 수 없으므로(GitHub 공식: step/job if
      # 컨텍스트에 secrets 미포함) env 로 주입해 shell 안에서 미설정(fork 등)을 판정한다.
      # 토큰 하드코딩 없음. 미설정이면 조용히 스킵(exit 0), 배포/알림 실패는 다음 스텝이 처리.
      - name: Send Telegram alert on failure
        if: ${{ steps.ping.outputs.healthy == 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM secrets 미설정 — 알림 스킵"
            exit 0
          fi
          curl -fsS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="[외부감시] 🚨 naver-estate-web 헬스체크 실패: https://api.2u.pe.kr/health/db 응답 없음 또는 비정상"

      # Actions 탭에서도 실패가 보이도록(두 번째 신호) — 알림 성공/스킵 여부와 무관하게 실패 처리
      - name: Fail the job if unhealthy
        if: ${{ steps.ping.outputs.healthy == 'false' }}
        run: exit 1
