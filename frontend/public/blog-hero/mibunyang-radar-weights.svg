<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="미분양 레이더 13축 가중치 — 손님 성향별 30초 줄세우기, 프리셋 3종 + 슬라이더 1-5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1E3A5F" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A8A8A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1A8A8A" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 좌측 큰 카피 영역 -->
  <text x="120" y="280"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1F2937" letter-spacing="-3">
    레이더 13축
  </text>
  <text x="120" y="400"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1A8A8A" letter-spacing="-3">
    가중치 응대
  </text>
  <rect x="120" y="430" width="80" height="4" fill="#D4A574"/>
  <text x="120" y="510"
        font-family="'Pretendard', sans-serif"
        font-size="32" font-weight="400" fill="#4B5563">
    9축 + 인프라 4축 · 손님 성향별 우위 단지
  </text>
  <text x="120" y="555"
        font-family="'Pretendard', sans-serif"
        font-size="28" font-weight="300" fill="#6B7280">
    프리셋 3종 + 슬라이더 1-5 · 종합 점수 한 줄 답
  </text>

  <!-- 좌측 하단 프리셋 3종 박스 -->
  <g transform="translate(120, 700)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#1A8A8A" stroke-width="2"/>
    <text x="90" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#1A8A8A" text-anchor="middle">균등</text>
    <text x="90" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">전축 3</text>

    <rect x="200" y="0" width="180" height="80" rx="12" fill="#1A8A8A"/>
    <text x="290" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">투자</text>
    <text x="290" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85" text-anchor="middle">전세가율·할인율 5</text>

    <rect x="400" y="0" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#1A8A8A" stroke-width="2"/>
    <text x="490" y="36" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#1A8A8A" text-anchor="middle">실거주</text>
    <text x="490" y="60" font-family="'Pretendard', sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">대기질·치안 5</text>
  </g>

  <!-- 슬라이더 1-5 시각화 -->
  <g transform="translate(120, 820)">
    <text x="0" y="20" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#6B7280">미세 조정</text>
    <line x1="120" y1="14" x2="580" y2="14" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="14" x2="430" y2="14" stroke="#1A8A8A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="430" cy="14" r="14" fill="#FFFFFF" stroke="#1A8A8A" stroke-width="3"/>
    <text x="600" y="20" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#1A8A8A">4</text>
    <text x="120" y="50" font-family="'Pretendard', sans-serif" font-size="13" fill="#9CA3AF">1</text>
    <text x="343" y="50" font-family="'Pretendard', sans-serif" font-size="13" fill="#9CA3AF">3</text>
    <text x="568" y="50" font-family="'Pretendard', sans-serif" font-size="13" fill="#9CA3AF">5</text>
  </g>

  <!-- 우측 13축 레이더 mockup 카드 -->
  <g transform="translate(1050, 220)" filter="url(#shadow)">
    <!-- 카드 프레임 -->
    <rect x="0" y="0" width="720" height="640" rx="16" fill="url(#card)" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="720" height="60" rx="16" fill="#1A8A8A"/>
    <rect x="0" y="44" width="720" height="16" fill="#1A8A8A"/>
    <circle cx="32" cy="30" r="6" fill="#D4A574"/>
    <circle cx="56" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <text x="120" y="38"
          font-family="'Pretendard', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">
      /mibunyang/compare · 레이더 13축
    </text>

    <!-- 레이더 차트 영역 (cx=360, cy=360, r=240) -->
    <g transform="translate(360, 360)">
      <!-- 13각형 그리드 4단계 (r=240, 180, 120, 60) -->
      <polygon points="0,-240 106.4,-215.7 199.6,-133.1 239.5,-22.8 219.2,99.6 144.7,191.6 36.8,237.2 -82.3,225.3 -181.0,158.0 -234.1,53.4 -234.1,-53.4 -181.0,-158.0 -82.3,-225.3"
               fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <polygon points="0,-180 79.8,-161.8 149.7,-99.8 179.6,-17.1 164.4,74.7 108.5,143.7 27.6,177.9 -61.7,168.9 -135.8,118.5 -175.6,40.0 -175.6,-40.0 -135.8,-118.5 -61.7,-168.9"
               fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <polygon points="0,-120 53.2,-107.9 99.8,-66.5 119.7,-11.4 109.6,49.8 72.3,95.8 18.4,118.6 -41.1,112.6 -90.5,79.0 -117.1,26.7 -117.1,-26.7 -90.5,-79.0 -41.1,-112.6"
               fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <polygon points="0,-60 26.6,-53.9 49.9,-33.3 59.9,-5.7 54.8,24.9 36.2,47.9 9.2,59.3 -20.6,56.3 -45.2,39.5 -58.5,13.3 -58.5,-13.3 -45.2,-39.5 -20.6,-56.3"
               fill="none" stroke="#E5E7EB" stroke-width="1"/>

      <!-- 13축 라인 -->
      <line x1="0" y1="0" x2="0" y2="-240" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="106.4" y2="-215.7" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="199.6" y2="-133.1" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="239.5" y2="-22.8" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="219.2" y2="99.6" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="144.7" y2="191.6" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="36.8" y2="237.2" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-82.3" y2="225.3" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-181.0" y2="158.0" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-234.1" y2="53.4" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-234.1" y2="-53.4" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-181.0" y2="-158.0" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="0" x2="-82.3" y2="-225.3" stroke="#E5E7EB" stroke-width="1"/>

      <!-- 단지 A (투자형 강조, 13축 우수) -->
      <polygon points="0,-200 79.8,-161.8 149.7,-99.8 119.7,-11.4 164.4,74.7 72.3,95.8 9.2,59.3 -41.1,112.6 -135.8,118.5 -175.6,40.0 -117.1,-26.7 -90.5,-79.0 -41.1,-112.6"
               fill="url(#radarFill)" stroke="#1A8A8A" stroke-width="3"/>

      <!-- 축 라벨 (13축, 9축 = #1A8A8A / 인프라 4축 = #D4A574) -->
      <g font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        <text x="0" y="-258" fill="#1A8A8A">세대수</text>
        <text x="118" y="-228" fill="#1A8A8A">주차</text>
        <text x="217" y="-138" fill="#1A8A8A">최고층</text>
        <text x="262" y="-18" fill="#1A8A8A">전세가율</text>
        <text x="239" y="115" fill="#1A8A8A">주변시세</text>
        <text x="158" y="210" fill="#1A8A8A">할인율</text>
        <text x="40" y="260" fill="#1A8A8A">미분양률</text>
        <text x="-90" y="247" fill="#1A8A8A">평당가</text>
        <text x="-198" y="173" fill="#1A8A8A">용적률</text>
        <text x="-256" y="58" fill="#D4A574">대기질</text>
        <text x="-256" y="-48" fill="#D4A574">의료</text>
        <text x="-198" y="-173" fill="#D4A574">보육</text>
        <text x="-90" y="-247" fill="#D4A574">치안</text>
      </g>
    </g>
  </g>

  <!-- 우측 하단 종합 점수 박스 (카드 안 아래) -->
  <g transform="translate(1050, 880)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="80" rx="12" fill="#1A8A8A"/>
    <text x="32" y="34"
          font-family="'Pretendard', sans-serif"
          font-size="14" font-weight="500" fill="#D4A574" letter-spacing="2">
      종합 점수 · 손님 성향별 1초 답
    </text>
    <text x="32" y="62"
          font-family="'Pretendard', sans-serif"
          font-size="20" font-weight="600" fill="#FFFFFF">
      A · 78점 ★
    </text>
    <text x="200" y="62" font-family="'Pretendard', sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.85">B · 65점</text>
    <text x="360" y="62" font-family="'Pretendard', sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.85">C · 71점</text>
    <text x="520" y="62" font-family="'Pretendard', sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.85">D · 58점</text>
  </g>

  <!-- 하단 브랜드 -->
  <text x="120" y="1010"
        font-family="'Pretendard', sans-serif"
        font-size="20" font-weight="600" fill="#1A8A8A" letter-spacing="3">
    2u.pe.kr · 미분양 응대
  </text>
</svg>
