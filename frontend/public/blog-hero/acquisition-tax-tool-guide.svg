<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="취득세 계산기 사용법 — 표준세율·다주택 중과·생애최초 200만 감면 자동 판정">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1EB"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1E3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 좌측 큰 카피 영역 -->
  <text x="120" y="280"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1F2937" letter-spacing="-3">
    취득세
  </text>
  <text x="120" y="400"
        font-family="'Noto Serif KR', serif"
        font-size="96" font-weight="700" fill="#1E3A5F" letter-spacing="-3">
    한 화면에 끝
  </text>
  <rect x="120" y="430" width="80" height="4" fill="#B89968"/>
  <text x="120" y="510"
        font-family="'Pretendard', sans-serif"
        font-size="32" font-weight="400" fill="#4B5563">
    표준세율 · 다주택 중과 · 생애최초 200만 감면 자동 판정
  </text>
  <text x="120" y="555"
        font-family="'Pretendard', sans-serif"
        font-size="28" font-weight="300" fill="#6B7280">
    취득가액 · 주택 수 · 평수 · 생애최초 · 오피스텔
  </text>

  <!-- 우측 도구 mockup 카드 -->
  <g transform="translate(1050, 220)" filter="url(#shadow)">
    <!-- 카드 프레임 -->
    <rect x="0" y="0" width="720" height="640" rx="16" fill="url(#card)" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="720" height="60" rx="16" fill="#1E3A5F"/>
    <rect x="0" y="44" width="720" height="16" fill="#1E3A5F"/>
    <circle cx="32" cy="30" r="6" fill="#B89968"/>
    <circle cx="56" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="30" r="6" fill="#FFFFFF" opacity="0.5"/>
    <text x="120" y="38"
          font-family="'Pretendard', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">
      /tools/acquisition-tax
    </text>

    <!-- 입력 필드 4개 -->
    <g font-family="'Pretendard', sans-serif" fill="#1F2937">
      <text x="40" y="120" font-size="16" font-weight="500" fill="#6B7280">취득가액</text>
      <rect x="40" y="135" width="640" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <text x="56" y="166" font-size="20" font-weight="600">12억 원</text>
      <text x="640" y="166" font-size="20" fill="#B89968" text-anchor="end">+</text>

      <text x="40" y="220" font-size="16" font-weight="500" fill="#6B7280">주택 수</text>
      <rect x="40" y="235" width="312" height="48" rx="8" fill="#1E3A5F"/>
      <text x="56" y="266" font-size="18" font-weight="600" fill="#FFFFFF">2 주택</text>
      <rect x="368" y="235" width="312" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <text x="384" y="266" font-size="18" fill="#6B7280">3 주택 이상</text>

      <text x="40" y="320" font-size="16" font-weight="500" fill="#6B7280">전용면적</text>
      <rect x="40" y="335" width="640" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <text x="56" y="366" font-size="20" font-weight="600">84.5 m²</text>

      <text x="40" y="420" font-size="16" font-weight="500" fill="#6B7280">생애최초 감면</text>
      <rect x="40" y="435" width="640" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <text x="56" y="466" font-size="20" fill="#1F2937" font-weight="600">적용</text>
    </g>

    <!-- 결과 박스 -->
    <rect x="40" y="510" width="640" height="100" rx="12" fill="#1E3A5F"/>
    <text x="60" y="545"
          font-family="'Pretendard', sans-serif"
          font-size="14" font-weight="500" fill="#B89968" letter-spacing="2">
      예상 취득세 (취득세 + 농특세 + 교육세)
    </text>
    <text x="60" y="590"
          font-family="'Noto Serif KR', serif"
          font-size="40" font-weight="700" fill="#FFFFFF">
      약 33,600,000 원
    </text>
    <text x="660" y="590"
          font-family="'Pretendard', sans-serif"
          font-size="20" fill="#B89968" text-anchor="end">/1회</text>
  </g>

  <!-- 하단 브랜드 -->
  <text x="120" y="1010"
        font-family="'Pretendard', sans-serif"
        font-size="20" font-weight="600" fill="#1E3A5F" letter-spacing="3">
    2u.pe.kr · 도구 활용
  </text>
</svg>
