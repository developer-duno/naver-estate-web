# Dependabot 자동 의존성 업데이트 — 무료(비공개 레포 포함). 세션 323 신설.
# 목적: 보안 advisory·버전 업데이트를 주1회 자동 PR. minor/patch 는 묶음(노이즈·Actions분 절약),
#       major 는 개별 PR 로 와도 머지는 사람이 판단(크롤링 핵심 의존성 curl_cffi 등은 상한 핀으로 자동 major 차단).
# 답습: .claude/rules 의 transitive 보안 핀 전략 + backend/requirements.txt 상한 핀(>=x,<y) 관행.
version: 2
updates:
  # 프론트엔드 (Next.js 16 / React 19 / TanStack Query 등)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      fe-minor-patch:
        update-types: ["minor", "patch"]
    # major 자동 차단 (세션 325) — 매주 재오픈+CI 실패 노이즈 방지. 근거는 메모리 실측.
    ignore:
      # eslint ^10 = React 플러그인 4종(react/react-hooks/jsx-a11y/import) peer 가 ^9 고정
      # → 강제 설치 시 런타임 깨짐. 플러그인 peer 출시 전 무의미 ([[project-eslint10-query-helpers-hold]]).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node ^23+ = 런타임 Node 22 LTS(engines node>=22) 보다 앞서가면 미존재 API 타입 노출.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # next / @next/mdx / eslint-config-next 3종은 항상 짝 버전으로 함께 올린다.
      # 옛 이력: 16.3.0 이 admin E2E 를 3연속 깨뜨려 PR #358 로 16.2.12 되돌리고
      # `versions: [">=16.3.0"]` 로 3종을 묶어 차단했었다 (세션 361·362).
      # 2026-09-09 GHSA-p293-qw3h-jr36(critical, Unauthenticated RCE on windows-hosted
      # servers) + AVIF Image Optimization RCE 로 16.3.4 전환 — 보안상 16.3 차단을 더
      # 유지할 수 없어 해제하고, 짝 3종을 동시 bump 했다 (세션 395). 메이저(17+)
      # 자동 상승은 계속 차단 — 짝 3종을 사람이 함께 검토해 올린다.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/mdx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # fullcalendar v7 = 단순 bump 가 아니라 패키지 구조 개편 — @fullcalendar/daygrid 가
      # 별도 패키지에서 사라지고 @fullcalendar/react/* entrypoint 로 통합(정식 v7 미출시,
      # 7.0.0-rc.0 까지만 존재). core 는 peer 제거·CSS 번들 제거·temporal-polyfill 추가라
      # dependabot 개별 PR(#365·#363) 머지 시 v6/v7 혼재로 빌드 깨짐 → 수동 마이그레이션
      # 전용으로 확정, major 자동 PR 차단 (세션 364).
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      # @tanstack/react-table v9 = 우리가 쓰는 named import 7종 중 핵심 4종이 개명·제거·재작성 대상
      # (useReactTable→useTable+features 필수, getCoreRowModel 제거, getSortedRowModel→
      # createSortedRowModel, ColumnDef 제네릭에 TFeatures 첫 인자). GA 2026-08-04 로
      # 신생(5일간 패치 3연속) + 런타임 의존성 @tanstack/react-store 신규 추가 — 기능
      # 이득 0 이라 성숙 후 수동 마이그레이션 전용 (fullcalendar 답습, 세션 374 공식
      # 마이그레이션 가이드 실측).
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # typescript 7 (Go 네이티브 컴파일러) = 이중 차단 — ① next build 타입체크가
      # TS7 을 지원하는 건 Next.js 16.3+ 뿐인데(공식 blog/next-16-3, JS API 제거로
      # 16.2 는 성립 불가) 16.3 은 위에서 이미 차단된 버전. ② eslint-config-next 가
      # 의존하는 typescript-eslint peer 가 `<6.1.0` 으로 TS7 명시 배제(이슈 #12518
      # closed as not planned — TS 7.1 안정 API 대기). 해제 조건 = next 16.3 차단
      # 해제 + typescript-eslint TS7 지원 출시 둘 다 (세션 374 공식문서 실측).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 백엔드 (FastAPI / curl_cffi / SQLAlchemy 등 — 상한 핀이 major 자동상승 차단)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      be-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions 워크플로 액션 버전 (actions/checkout 등)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
