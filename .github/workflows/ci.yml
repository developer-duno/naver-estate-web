name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Playwright 시각 회귀 baseline 갱신 (Linux). artifact 3개(updated-snapshots-admin/-public/-public-visual) — 각 꾸러미는 자기 프로젝트 접미사(-<project>-linux.png) 파일만 유효. sha256 대조 후 달라진 것만 커밋. 절차 = .claude/rules/testing.md"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# paths-filter 가 pull_request 이벤트에서 변경 파일 목록을 GitHub API 로
# 조회할 때 pull-requests: read 권한이 필요하다. permissions 블록을
# 명시하면 그 외 권한은 모두 none 으로 축소된다 (최소 권한 원칙).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # npm audit — package-lock.json 보안 advisory 검사 (BE pip-audit 과 대칭)
      # --omit=dev = 배포 앱 prod 의존성만 (dev 도구 취약점 노이즈 방지)
      # --audit-level=high = high·critical 만 실패 (moderate 이하는 dependabot 이 별도 PR 처리)
      # 오탐 발생 시 = package.json overrides 로 버전 고정 (npm audit 은 per-advisory ignore 플래그 없음, 세션 339)
      - name: Security audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app

      - name: Compliance
        run: npm run check:ad-compliance

      - name: Mdx-JSX guard
        run: npm run check:mdx-jsx

      - name: Job label guard
        run: npm run check:job-labels

      # 시각회귀 안전망 되돌림 가드 (세션 400) — 아래 넷이 조용히 무력화되는 것을 막는다:
      #   ① 갱신 플래그가 `=all` 이 아닌 값으로 되돌아가는 것(파일 미갱신)
      #   ② 헤더 전용 스냅샷의 임계가 완화·mask 추가·skip 되는 것
      #   ③ per-call maxDiffPixelRatio 가 0.02 초과 또는 변수 우회로 바뀌는 것
      #   ④ 전역 임계·프로젝트 매칭이 바뀌어 헤더 스냅샷이 아예 안 돌게 되는 것
      - name: Visual regression guard
        run: npm run check:visual-guard

      - name: Test
        run: npm test

  # setup+admin+public+public-visual 4 project 를 한 job 에서 순차 실행하면
  # 대기시간이 길다(public-visual 이 특히 무거움). GitHub Actions matrix 로
  # 3 project(admin/public/public-visual)를 병렬 job 으로 쪼개 대기시간을 줄인다
  # (세션 352). admin 은 setup 산출물(storageState)이 필요하므로 별도 job 에서
  # 먼저 만들어 artifact 로 넘긴다. public·public-visual 은 인증 불필요라 setup
  # 과 무관하게 동시 시작.
  e2e-setup:
    name: E2E setup (admin auth)
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      auth-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run setup (admin auth)
        run: npx playwright test --project=setup
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:9999

      # secrets 미설정 시 setup 이 skip 되어 admin.json 이 안 생긴다 — 그 경우
      # admin job 이 storageState 없이 실행되지 않도록 존재 여부를 다음 job 에 전달.
      - id: check
        run: |
          if [ -f "e2e/.auth/admin.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-state
          path: frontend/e2e/.auth/admin.json
          retention-days: 1

  e2e:
    name: Frontend E2E (${{ matrix.project }})
    needs: [changes, frontend, e2e-setup]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [admin, public, public-visual]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - if: matrix.project == 'admin' && needs.e2e-setup.outputs.auth-exists == 'true'
        uses: actions/download-artifact@v8
        with:
          name: admin-auth-state
          path: frontend/e2e/.auth

      # ⚠ 반드시 `--update-snapshots=all` — 값 없는 `--update-snapshots`(= changed 모드)는
      #   **허용오차 안이면 PNG 파일을 아예 건드리지 않는다**(playwright 1.63.0
      #   lib/matchers/expect.js handleMatching 이 미기록). 그래서 baseline 을 갱신하려고
      #   dispatch 를 돌려도 artifact 에 옛 파일이 그대로 담겨 "변경 없음"으로 오판한다 —
      #   #498 dispatch run 34699999010 의 3 job 로그에 `is re-generated` 줄이 0건인 것이
      #   그 실증이다. `=all` 은 오차 무관 덮어쓰되 바이트 동일이면 안 써서 멱등하다.
      #   갱신 여부 판정 = 로그의 `is re-generated, writing actual.` 줄 수(신규 장은
      #   `A snapshot doesn't exist ... writing actual.`) == sha 변경 장 수. 절차·판정 =
      #   .claude/rules/testing.md §baseline 재생성.
      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} ${{ inputs.update_snapshots && '--update-snapshots=all' || '' }}
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:9999

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 14

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-screenshots-${{ matrix.project }}
          path: frontend/test-results
          retention-days: 14

      # workflow_dispatch + update_snapshots=true 일 때만 baseline 업로드.
      #
      # ⚠ 이 꾸러미는 **그 프로젝트가 재촬영한 것만이 아니라 e2e/ 의 PNG 전량**(현재 19장, 헤더 baseline 생성 후 20장)**을 담는다
      #   (path 글롭이 전체 스냅샷 디렉터리). 따라서 3꾸러미를 한 폴더에 통째로 합치면 옛본이
      #   새본을 덮는다 — 꾸러미 p 에서는 `*-<p>-linux.png` 파일만 유효한 재촬영본이다.
      #   sha256 대조 후 달라진 것만 커밋. 절차 = .claude/rules/testing.md §baseline 재생성.
      #
      # always() 필수 — 갱신 run 에서 어느 test 가 실패해도 나머지 PNG 는 받아야 하기 때문.
      #   단 그 대가로 **촬영 전 단언에서 죽은 장은 옛 PNG 가 그대로 담긴다(sha 불변 ≠ 동일)** —
      #   각 job 의 스냅샷 테스트 pass 여부를 함께 볼 것. 특히 baseline 이 없는 신규 장은
      #   불안정하면 PNG 가 아예 생성되지 않고 job 이 빨강이 된다(그 경우 재dispatch 가 아니라
      #   촬영 전 대기 조건을 보강해야 한다).
      - if: always() && inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots-${{ matrix.project }}
          path: frontend/e2e/**/*-snapshots/**
          retention-days: 14

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libffi-dev

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      # pip-audit — requirements.txt 보안 advisory 검사 (Python 공식 OSV·PyPI Advisory DB)
      # 예외 0 — MAL-2026-4750(fastapi 0.136.3 [standard] extra 의 fastar typosquat) 예외는
      # 세션 398(2026-09-11)에 제거. 제거 사유 = **OSV 에서 2026-05-26 withdrawn(철회)** 되어
      # 어떤 버전에서도 더 이상 매칭되지 않는다(api.osv.dev/v1/vulns/MAL-2026-4750 의
      # withdrawn: 2026-05-26T13:04:03Z). 취약 버전 `fastapi==0.136.3` 으로 고정해 돌려도
      # `No known vulnerabilities found` 임을 실측 확인 — 즉 버전 상향(>=0.141.1)이 아니라
      # advisory 철회가 사유다.
      # 앞으로 예외 해제 판정은 두 가지로 한다: ① OSV 에서 그 ID 의 withdrawn/affected 범위 확인
      # ② 취약 버전으로 고정해 재현되는지 확인. 예외를 추가할 때도 이 판정 기준을 같은 자리에 적는다.
      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      - name: Syntax validation
        run: |
          python -c "
          import sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('.').rglob('*.py')):
              if '__pycache__' in str(f):
                  continue
              try:
                  compile(f.read_text(encoding='utf-8'), str(f), 'exec')
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          count = len([f for f in pathlib.Path('.').rglob('*.py') if '__pycache__' not in str(f)])
          print(f'All {count} Python files have valid syntax')
          "

      - name: Test
        run: |
          pip install pytest httpx pytest-xdist
          python -m pytest -n auto
        env:
          DATABASE_URL: sqlite://
          SUPABASE_JWT_SECRET: test-ci-secret
