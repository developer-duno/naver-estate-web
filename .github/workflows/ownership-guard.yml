name: Ownership guard

# 공유 DB 소유권 가드 (세션 459) — 미분양 정본 supabase/ownership.json 과 2u 백엔드 코드를 대조한다.
# 판정·끄는 법 = backend/scripts/audit_shared_db_ownership.py 머리 주석. 정본은 raw URL 로 받는다(토큰 불필요).
# 월요일 정기 실행은 코드가 그대로여도 정본이 바뀌어 어긋난 것을 잡는다.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    # ⚠ 이 이름은 GitHub 규칙 묶음 18063894 의 필수 검사 이름이다 — 바꾸면 모든 PR 이 "대기"로 멈춘다(규칙 쪽도 같이 바꿀 것).
    name: Shared DB ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # ④ 마이그 diff(<기준>...HEAD)에 기준 커밋이 필요하다
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit against mibunyang ownership.json
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) SINCE="origin/$BASE_REF" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                SINCE="HEAD~1"
              else
                SINCE="$BEFORE"
              fi ;;
            *) SINCE="" ;;
          esac
          if [ -n "$SINCE" ]; then
            python backend/scripts/audit_shared_db_ownership.py --since "$SINCE"
          else
            python backend/scripts/audit_shared_db_ownership.py --off-stale-days 14
          fi

      # 월요일 정기 실행이 빨간불이면 아무도 모른다(PR 은 화면에 보이지만 정기 실행은 안 보인다 — 세션 465 B3).
      # 정기 실행이 실패했을 때만 텔레그램 한 통. PR·push 실패는 그 화면에서 보이므로 보내지 않는다.
      # 문구 규칙·줄바꿈($'...')·시크릿 미설정 스킵은 healthcheck.yml 의 알림 단계와 같다.
      - name: Send Telegram alert on scheduled failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM secrets 미설정 — 알림 스킵"
            exit 0
          fi
          MSG=$'[서버 알림] ⚠ 미분양과 같이 쓰는 자료 창고 규칙 검사가 실패했어요\n우리 코드가 미분양 쪽 규칙과 어긋났거나, 미분양 쪽 규칙을 못 받아 왔거나, 검사를 너무 오래 꺼 둔 것 중 하나예요.\n→ 손님 화면에는 영향이 없어요. 급하지 않으니 Claude 에게 알려주시면 확인합니다.'
          curl -fsS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}"
